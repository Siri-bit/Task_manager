<div class="register-container">
  <h2>Create Account</h2>

  <form (ngSubmit)="register()">

    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Email"
      required
    >

    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Register
    </button>

  </form>

  <p style="color:green">{{message}}</p>
  <p style="color:red">{{error}}</p>

  <p>
    Already have an account?
    <a routerLink="/login">Login</a>
  </p>
</div>
